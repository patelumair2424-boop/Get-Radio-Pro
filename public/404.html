<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Get Radio Pro</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback. Rewrites /some/route into /?/some/route so the
      // custom-domain root serves index.html; index.html restores the real URL.
      // 0 = site is served from the domain root (custom domain), not /<repo>/.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
