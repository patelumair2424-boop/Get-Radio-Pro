    <script type="text/javascript">
      // Counterpart to public/404.html: turn /?/some/route back into /some/route
      // before the router boots, so GitHub Pages deep links resolve correctly.
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
